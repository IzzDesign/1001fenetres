  <head>
    <!-- Required meta tags -->

    <link rel="shortcut icon" type="image/x-icon" href="./favicon.ico">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

    <!-- Design -->
    <link href="https://fonts.googleapis.com/css?family=Gelasio:500|Roboto:400,500,700,900&display=swap" rel="stylesheet">

    <script>
      if(localStorage && !localStorage.getItem('landing')) {
        localStorage.setItem("landing", document.location);
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/tarteaucitronjs@latest/tarteaucitron.min.js"></script>

    <script>
    tarteaucitron.init({
        "privacyUrl": "https://1001fenetres.fr", /* URL de ta page de confidentialité */
        "hashtag": "#tarteaucitron",
        "cookieName": "tarteaucitron",
        "orientation": "bottom",
        "showAlertSmall": false,
        "cookieslist": true,
        "adblocker": false,
        "highPrivacy": true,
        "handleBrowserDNTRequest": false,
        "removeCredit": false,
        "moreInfoLink": true,
        "useExternalCss": false,
        "mandatory": false,
        "googleConsentMode": true  /* Active le Consent Mode v2 */
    });
    </script>
    <script>
      tarteaucitron.user.googletagmanagerId = 'GTM-UA-156466349-1'; // Ton ID GTM
      (tarteaucitron.job = tarteaucitron.job || []).push('googletagmanager');
    </script>
    {% include analytics.html %}
    {% include metas.html %}

    <title>
        {% if page.title %}
            {{ page.title }} &middot; 1001 Fenêtres
        {% else %}
        1001 Fenêtres
        {% endif %}
    </title>
